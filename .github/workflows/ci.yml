name: ci
on:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc --noEmit
      - run: node --experimental-strip-types scripts/phase1-check.ts
      - run: node --experimental-strip-types scripts/phase2-check.ts
